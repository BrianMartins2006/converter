<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Converter | Redes 1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <div class="logo">CONVERTER.IO</div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('conversor') }}">Conversor</a>
            <a href="{{ url_for('equipe') }}">Equipe</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 - Projeto Redes de Computadores 1 - Prof. Fábio Corsini</p>
    </footer>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Resultado</h2>
            <div class="result-value" id="resultText">---</div>
            <p id="modalSubtitle"></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
